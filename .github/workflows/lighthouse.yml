name: Lighthouse

on:
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start preview server
        run: |
          npx wrangler dev --port 4321 --local > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4321/ > /dev/null; then echo "server up"; break; fi
            sleep 1
          done
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4321/
            http://localhost:4321/projects
            http://localhost:4321/impact
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./lighthouserc.json
      - name: Stop preview server
        if: always()
        run: kill $(cat /tmp/preview.pid) || true
