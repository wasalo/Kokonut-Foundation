name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - name: Apply D1 migrations (production)
        if: github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply kokonut-foundation-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy (production)
        if: github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Health check (production)
        if: github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_API_TOKEN != ''
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://kokonut.foundation/api/health || true)
            echo "health check attempt $i: $code"
            if [ "$code" = "200" ]; then echo "healthy"; exit 0; fi
            sleep 5
          done
          echo "health check failed"; exit 1
